<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="600" height="260" fill="#ffffff"/>

  <!-- Axe -->
  <line x1="180" y1="30" x2="180" y2="220" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="180" y1="220" x2="560" y2="220" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Repères 10/20/30/40% -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="270" y1="30" x2="270" y2="220"/>
    <line x1="360" y1="30" x2="360" y2="220"/>
    <line x1="450" y1="30" x2="450" y2="220"/>
    <line x1="540" y1="30" x2="540" y2="220"/>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="180" y="238">0%</text>
    <text x="270" y="238">10%</text>
    <text x="360" y="238">20%</text>
    <text x="450" y="238">30%</text>
    <text x="540" y="238">40%</text>
  </g>

  <!-- UEFA 37% -->
  <text x="170" y="80" text-anchor="end" font-size="14" font-weight="600" fill="#0d1b2a">UEFA</text>
  <rect x="180" y="60" width="333" height="36" rx="4" fill="#2f8ca8"/>
  <text x="523" y="83" font-size="14" font-weight="700" fill="#123162">37 %</text>

  <!-- CONCACAF 12% -->
  <text x="170" y="160" text-anchor="end" font-size="14" font-weight="600" fill="#0d1b2a">CONCACAF</text>
  <rect x="180" y="140" width="108" height="36" rx="4" fill="#e63946"/>
  <text x="298" y="163" font-size="14" font-weight="700" fill="#123162">12 %</text>

  <text x="370" y="20" text-anchor="middle" font-size="12" fill="#64748b">Part des joueurs par confédération (2 exemples sur 6)</text>
</svg>
