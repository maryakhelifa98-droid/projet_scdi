<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="480" height="420" fill="#ffffff"/>

  <text x="240" y="18" text-anchor="middle" font-size="12" fill="#64748b">Schéma — matrice de confusion parfaitement diagonale (illustration)</text>

  <!-- Labels colonnes (prédiction) -->
  <text x="240" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#0d1b2a">Poste prédit</text>
  <g font-size="10.5" fill="#334155" text-anchor="middle">
    <text x="152" y="60">Gard.</text>
    <text x="228" y="60">Déf.</text>
    <text x="304" y="60">Mil.</text>
    <text x="380" y="60">Att.</text>
  </g>

  <!-- Label ligne (réel) -->
  <text x="30" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#0d1b2a" transform="rotate(-90 30 240)">Poste réel</text>
  <g font-size="10.5" fill="#334155" text-anchor="end">
    <text x="112" y="106">Gardien</text>
    <text x="112" y="182">Défenseur</text>
    <text x="112" y="258">Milieu</text>
    <text x="112" y="334">Attaquant</text>
  </g>

  <!-- Grille 4x4, cellules 76x76 démarrant à 114,68 -->
  <g>
    <!-- Ligne Gardien -->
    <rect x="114" y="68"  width="76" height="76" fill="#123162"/>
    <rect x="190" y="68"  width="76" height="76" fill="#eef2f7"/>
    <rect x="266" y="68"  width="76" height="76" fill="#eef2f7"/>
    <rect x="342" y="68"  width="76" height="76" fill="#eef2f7"/>
    <!-- Ligne Défenseur -->
    <rect x="114" y="144" width="76" height="76" fill="#eef2f7"/>
    <rect x="190" y="144" width="76" height="76" fill="#123162"/>
    <rect x="266" y="144" width="76" height="76" fill="#eef2f7"/>
    <rect x="342" y="144" width="76" height="76" fill="#eef2f7"/>
    <!-- Ligne Milieu -->
    <rect x="114" y="220" width="76" height="76" fill="#eef2f7"/>
    <rect x="190" y="220" width="76" height="76" fill="#eef2f7"/>
    <rect x="266" y="220" width="76" height="76" fill="#123162"/>
    <rect x="342" y="220" width="76" height="76" fill="#eef2f7"/>
    <!-- Ligne Attaquant -->
    <rect x="114" y="296" width="76" height="76" fill="#eef2f7"/>
    <rect x="190" y="296" width="76" height="76" fill="#eef2f7"/>
    <rect x="266" y="296" width="76" height="76" fill="#eef2f7"/>
    <rect x="342" y="296" width="76" height="76" fill="#123162"/>
  </g>

  <!-- Contours -->
  <g fill="none" stroke="#cbd5e1" stroke-width="1">
    <rect x="114" y="68" width="304" height="304"/>
    <line x1="190" y1="68" x2="190" y2="372"/>
    <line x1="266" y1="68" x2="266" y2="372"/>
    <line x1="342" y1="68" x2="342" y2="372"/>
    <line x1="114" y1="144" x2="418" y2="144"/>
    <line x1="114" y1="220" x2="418" y2="220"/>
    <line x1="114" y1="296" x2="418" y2="296"/>
  </g>

  <!-- Icônes diagonale (100%) -->
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="152" y="110">100%</text>
    <text x="228" y="186">100%</text>
    <text x="304" y="262">100%</text>
    <text x="380" y="338">100%</text>
  </g>

  <text x="240" y="398" text-anchor="middle" font-size="10.5" fill="#e63946" font-weight="600">
    <tspan x="240" dy="0">Aucune confusion hors diagonale → signal d'alerte,</tspan>
    <tspan x="240" dy="14">pas une performance à célébrer</tspan>
  </text>
</svg>
