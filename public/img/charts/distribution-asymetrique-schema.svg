<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="600" height="260" fill="#ffffff"/>
  <text x="300" y="18" text-anchor="middle" font-size="12" fill="#64748b">Schéma — forme typique d'une distribution asymétrique (ex. buts marqués, valeur marchande)</text>

  <line x1="60" y1="30" x2="60" y2="210" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="60" y1="210" x2="560" y2="210" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Histogramme asymétrique à droite (majorité de faibles valeurs, longue traîne) -->
  <g fill="#2f8ca8">
    <rect x="70"  y="60"  width="34" height="150"/>
    <rect x="108" y="90"  width="34" height="120"/>
    <rect x="146" y="115" width="34" height="95"/>
    <rect x="184" y="140" width="34" height="70"/>
    <rect x="222" y="160" width="34" height="50"/>
    <rect x="260" y="175" width="34" height="35"/>
    <rect x="298" y="188" width="34" height="22"/>
    <rect x="336" y="196" width="34" height="14"/>
    <rect x="374" y="201" width="34" height="9"/>
    <rect x="412" y="204" width="34" height="6"/>
    <rect x="450" y="206" width="34" height="4"/>
    <rect x="488" y="207" width="34" height="3"/>
  </g>

  <text x="70" y="228" font-size="11" fill="#64748b">Faible</text>
  <text x="500" y="228" text-anchor="end" font-size="11" fill="#64748b">Élevée (rare)</text>
  <text x="300" y="245" text-anchor="middle" font-size="11" font-weight="600" fill="#0d1b2a">Valeur de la statistique →</text>

  <path d="M 90 60 L 500 202" stroke="#e63946" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <text x="500" y="196" text-anchor="end" font-size="10.5" fill="#e63946" font-weight="600">longue traîne</text>
</svg>
