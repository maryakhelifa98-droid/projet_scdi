<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="600" height="260" fill="#ffffff"/>

  <line x1="80" y1="20" x2="80" y2="220" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="80" y1="220" x2="560" y2="220" stroke="#cbd5e1" stroke-width="1"/>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="80" y1="176" x2="560" y2="176"/>
    <line x1="80" y1="132" x2="560" y2="132"/>
    <line x1="80" y1="88" x2="560" y2="88"/>
    <line x1="80" y1="44" x2="560" y2="44"/>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="end">
    <text x="72" y="224">0%</text>
    <text x="72" y="180">20%</text>
    <text x="72" y="136">40%</text>
    <text x="72" y="92">60%</text>
    <text x="72" y="48">80%</text>
  </g>

  <!-- Univarié 13% -->
  <rect x="170" y="191" width="90" height="29" rx="4" fill="#5aa9c2"/>
  <text x="215" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#123162">13 %</text>
  <text x="215" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#0d1b2a">Modèle univarié</text>
  <text x="215" y="253" text-anchor="middle" font-size="10.5" fill="#64748b">valeur marchande seule</text>

  <!-- Multivarié 58.8% -->
  <rect x="360" y="90" width="90" height="130" rx="4" fill="#123162"/>
  <text x="405" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#123162">58,8 %</text>
  <text x="405" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#0d1b2a">Modèle multiple</text>
  <text x="405" y="253" text-anchor="middle" font-size="10.5" fill="#64748b">+ poste + âge</text>

  <text x="320" y="15" text-anchor="middle" font-size="12" fill="#64748b">R² — part de variance expliquée de la performance</text>
</svg>
